services:
  mysql:
    image: mysql:8.4
    container_name: domhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: domhub
      MYSQL_USER: domhub
      MYSQL_PASSWORD: domhub123
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  domhub:
    image: ghcr.io/onemore-coder/domhub:latest   # 也可本地构建：docker compose build domhub
    build: .
    container_name: domhub
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DOMHUB_SERVER_MODE: release
      DOMHUB_DB_DRIVER: mysql
      DOMHUB_DB_DSN: "domhub:domhub123@tcp(mysql:3306)/domhub?charset=utf8mb4&parseTime=True&loc=Local"
      DOMHUB_JWT_SECRET: "please-change-me-to-a-random-string"
      DOMHUB_ADMIN_USERNAME: admin
      DOMHUB_ADMIN_PASSWORD: admin123

volumes:
  mysql_data:
