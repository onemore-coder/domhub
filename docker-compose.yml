# DomHub Docker Compose
#
# 默认：单容器 SQLite 部署（推荐，个人自托管够用，拉取快、备份就是拷一个文件）
#   docker compose up -d
#
# 需要 MySQL（多实例 / 高并发写入场景）：
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d
services:
  domhub:
    image: ghcr.io/onemore-coder/domhub:latest   # 也可本地构建：docker compose build domhub
    build: .
    container_name: domhub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DOMHUB_SERVER_MODE: release
      DOMHUB_DB_DRIVER: sqlite
      DOMHUB_DB_DSN: /app/data/domhub.db
      DOMHUB_JWT_SECRET: "please-change-me-to-a-random-string"
      # 云凭证加密密钥：与 JWT 密钥分开设置，日后更换 JWT 密钥不影响已存凭证解密
      DOMHUB_CRYPTO_KEY: "please-change-me-too-32-chars-min"
      DOMHUB_ADMIN_USERNAME: admin
      DOMHUB_ADMIN_PASSWORD: admin123
    volumes:
      - domhub_data:/app/data   # SQLite 数据落盘，容器重建不丢

volumes:
  domhub_data:
